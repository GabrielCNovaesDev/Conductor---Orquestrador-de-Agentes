services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: multiagent
      POSTGRES_USER: multiagent
      POSTGRES_PASSWORD: multiagent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multiagent -d multiagent"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: development
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://multiagent:multiagent@postgres:5432/multiagent}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: ${PORT:-3000}
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEFAULT_TASK_TIMEOUT_MS: ${DEFAULT_TASK_TIMEOUT_MS:-60000}
      DEFAULT_MAX_COST_PER_TASK_USD: ${DEFAULT_MAX_COST_PER_TASK_USD:-0.50}
    ports:
      - "3000:3000"
    volumes:
      - ../apps:/app/apps
      - ../packages:/app/packages
      - ../tsconfig.base.json:/app/tsconfig.base.json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: development
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - "5173:5173"
    volumes:
      - ../apps:/app/apps
      - ../packages:/app/packages
      - ../tsconfig.base.json:/app/tsconfig.base.json
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
